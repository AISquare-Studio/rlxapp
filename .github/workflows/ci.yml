name: CI

# Triggers mirror rlx's ci.yml: every PR into main or a release train (rc/**), every
# push to them, and runs by hand (`gh workflow run ci.yml --ref <branch>`).
on:
  pull_request:
    branches: [main, "rc/**"]
  push:
    branches: [main, "rc/**"]
  workflow_dispatch:

# Concurrency: only superseded PR runs are cancelled.
#   - A pull_request run is grouped by its ref, so a newer push to the PR cancels the
#     older run, whether it is running or still pending.
#   - Every other run (a push to main or rc/**, the merge gates, and a run by hand)
#     gets a group of its own, keyed by its run id. It never waits behind another run,
#     so nothing can cancel it: not while it runs, and not while it is pending. (In a
#     shared group, a third run would cancel the pending second one even with
#     cancel-in-progress off.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# THE LAYOUT
#   app     one job per OS (macOS, Windows, Linux). Each job runs:
#             - web lint, typecheck and tests;
#             - Rust fmt, clippy and tests, for the product and for the e2e test build;
#             - an unsigned `tauri build` of that OS's installers;
#             - a smoke test of the built binary (under xvfb on Linux): it must paint
#               its first frame and stay up for 5 s after it;
#             - idle memory: on Windows and Linux, scripts/idle-memory.mjs (private
#               working set and PSS); on macOS, scripts/measure-budgets.sh
#               (phys_footprint, plus installer size and cold start);
#             - an upload of the installers as run artifacts;
#             - native e2e on the e2e test build: the widget isolation probe on every OS,
#               and tauri-driver screen checks on Windows and Linux. Screenshots and probe
#               results upload as e2e-screenshots-<os>;
#             - last, the installer size gate: it fails the job if a .dmg, .msi,
#               setup .exe, .deb or .rpm is over 25,000,000 bytes (the AppImage is
#               report-only). It runs after the upload and the budget measurement,
#               so an oversized installer is still uploaded and can be inspected.
#   ci-ok   passes only when every app job did: the one check for branch protection
#           to require, however many legs there are.
#
# main holds no app code until the release train lands (only repo infra: the README,
# LICENSE, governance files and this workflow). Every app step is therefore guarded by
# hashFiles('src-tauri/Cargo.toml') != '', and on main the jobs pass as no-ops.

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            slug: macos
            os: macos-latest
            # DMGs are built only in CI: building one opens Finder windows (see README).
            bundles: app,dmg
            binary: src-tauri/target/release/bundle/macos/rlx.app/Contents/MacOS/rlxapp
          - name: Windows
            slug: windows
            os: windows-latest
            bundles: msi,nsis
            binary: src-tauri/target/release/rlxapp.exe
          - name: Linux
            slug: linux
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            binary: src-tauri/target/release/rlxapp
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: No app tree on this ref, nothing to build
        if: hashFiles('src-tauri/Cargo.toml') == ''
        run: echo "::notice::src-tauri/Cargo.toml is absent on this ref; the app steps are skipped."

      - name: Install Linux system dependencies (WebKitGTK 4.1, its WebDriver, xvfb)
        if: runner.os == 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@v7
        if: hashFiles('src-tauri/Cargo.toml') != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (version pinned in rust-toolchain.toml)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        if: hashFiles('src-tauri/Cargo.toml') != ''
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: npm ci

      - name: Lint (web)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: npm run lint

      - name: Typecheck (web)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: npm run typecheck

      - name: Test (web)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: npm test

      - name: Format check (Rust)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (Rust)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (Rust)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        working-directory: src-tauri
        run: cargo test --locked

      # The test build (cargo feature e2e: the widget isolation probe and its canary) is
      # linted and tested too. Releases never enable it.
      - name: Clippy and test (Rust, e2e test build)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        working-directory: src-tauri
        run: |
          cargo clippy --locked --all-targets --features e2e -- -D warnings
          cargo test --locked --features e2e

      - name: Build installers (unsigned)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # Network.framework's per-webview proxy symbols are macOS 14+, so build.rs weak-links it
      # (src-tauri/src/widget_host/proxy.rs). A strong link would stop the app launching on
      # macOS 11-13, so fail if anything makes it one.
      - name: Network.framework stays weak-linked
        if: runner.os == 'macOS' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          kinds=$(otool -l "${{ matrix.binary }}" | awk '/^ *cmd LC_/ { cmd = $2 } / name .*\/Network\.framework\// { print cmd }' | sort -u)
          echo "Network.framework load commands: ${kinds:-none}"
          test "$kinds" = "LC_LOAD_WEAK_DYLIB"

      - name: Smoke test (xvfb)
        if: runner.os == 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        run: xvfb-run --auto-servernum node scripts/smoke-test.mjs "${{ matrix.binary }}"

      - name: Smoke test
        if: runner.os != 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        run: node scripts/smoke-test.mjs "${{ matrix.binary }}"

      - name: Idle memory (xvfb, informational)
        if: runner.os == 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        run: xvfb-run --auto-servernum node scripts/idle-memory.mjs "${{ matrix.binary }}"

      - name: Idle memory (informational)
        if: runner.os == 'Windows' && hashFiles('src-tauri/Cargo.toml') != ''
        run: node scripts/idle-memory.mjs "${{ matrix.binary }}"

      - name: Measure budgets (informational)
        if: runner.os == 'macOS' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          scripts/measure-budgets.sh --runs 3 | tee budgets.txt
          {
            echo '### Budgets (virtualized macOS CI runner; numbers are noisy, local Apple-silicon runs are the reference)'
            echo '```'
            cat budgets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installers
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: rlx-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Native end-to-end tests (e2e/native/, `npm run e2e`) on the test build (cargo feature
      # e2e): the widget isolation probe on every OS, then the tauri-driver screen checks on
      # Windows and Linux. macOS has no WebDriver for WKWebView; its window, menu, close,
      # reopen and quit checks run locally (scripts/mac-native-check.sh).
      - name: Build the e2e test build
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: npm run e2e:build

      - name: Install tauri-driver
        if: runner.os != 'macOS' && hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo install tauri-driver --locked --version 2.1.0

      # msedgedriver must match the WebView2 runtime the app runs on, not Edge.
      - name: Install msedgedriver for this runner's WebView2
        if: runner.os == 'Windows' && hashFiles('src-tauri/Cargo.toml') != ''
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No WebView2 runtime found in the registry' }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          $zip = Join-Path $env:RUNNER_TEMP 'msedgedriver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          & $driver --version
          "TAURI_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "### WebView2 $version, msedgedriver $((& $driver --version) -join ' ')" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The probe measures DNS (src-tauri/src/e2e/dns.rs): its own zone resolves through its
      # DNS listener, so a widget's hostname looked up outside the deny-all proxy is seen, and
      # main's names are the positive control. Windows' NRPT can only name port 53.
      - name: Route the probe's DNS zone to its listener (macOS)
        if: runner.os == 'macOS' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          sudo mkdir -p /etc/resolver
          printf 'nameserver 127.0.0.1\nport 53535\n' | sudo tee /etc/resolver/rlx-probe-dns.test
          sudo killall -HUP mDNSResponder || true
          scutil --dns | grep -B1 -A4 'rlx-probe-dns.test' || true
          echo "RLXAPP_E2E_DNS_PORT=53535" >> "$GITHUB_ENV"

      - name: Route the probe's DNS zone to its listener (Windows)
        if: runner.os == 'Windows' && hashFiles('src-tauri/Cargo.toml') != ''
        shell: pwsh
        run: |
          Add-DnsClientNrptRule -Namespace ".rlx-probe-dns.test" -NameServers "127.0.0.1"
          Get-DnsClientNrptRule | Format-Table -AutoSize Namespace, NameServers
          Clear-DnsClientCache
          "RLXAPP_E2E_DNS_PORT=53" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # RLX_PROBE_STRICT=1 makes every gate check fail the run, whatever the agent-made widgets
      # switch says, so the widgets webview's network isolation (its deny-all proxy,
      # src-tauri/src/widget_host/proxy.rs) must hold on every OS: each side's preconnect to
      # every target must reach only the proxy (or, on Windows, nothing at all, by a netstat
      # witness), and no widget name may be looked up. On macOS the local-network residual
      # (this Mac, and link-local IPv4) is recorded as info, and the dns-prefetch lookups are
      # the known reason macOS isn't eligible: a gate that doesn't fail the run on its own.
      - name: Native e2e (xvfb)
        if: runner.os == 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        env:
          RLX_PROBE_STRICT: "1"
        run: xvfb-run --auto-servernum npm run e2e

      - name: Native e2e
        if: runner.os != 'Linux' && hashFiles('src-tauri/Cargo.toml') != ''
        env:
          RLX_PROBE_STRICT: "1"
        run: npm run e2e

      # With frames.js's WebRTC removal skipped: records what WebView2's network setup alone
      # does with WebRTC (its UDP gets past the proxy, so frames.js is the barrier), and still
      # gates every other channel strictly (src-tauri/src/widget_host/proxy.rs).
      - name: Native e2e, WebRTC kept (Windows)
        if: runner.os == 'Windows' && hashFiles('src-tauri/Cargo.toml') != ''
        env:
          RLX_PROBE_STRICT: "1"
        run: node e2e/native/probe.mjs --rtc-kept

      - name: Upload e2e screenshots and probe results
        if: always() && hashFiles('src-tauri/Cargo.toml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.slug }}
          path: |
            e2e/screenshots/
            e2e/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Installer size gate (<= 25 MB)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          status=0
          node scripts/installer-sizes.mjs > sizes.md || status=$?
          cat sizes.md
          {
            echo "### Installers (${{ matrix.name }}); budget <= 25 MB"
            cat sizes.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every app job passed
        run: |
          echo "app: ${{ needs.app.result }}"
          test "${{ needs.app.result }}" = success
