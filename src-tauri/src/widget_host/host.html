<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>rlx widgets</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
        padding: 8px;
      }
      #grid iframe {
        width: 100%;
        height: 160px;
        border: 0;
        border-radius: 10px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script src="/host/host.js"></script>
    <!--extra-scripts-->
  </body>
</html>
