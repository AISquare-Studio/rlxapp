[package]
name = "rlxapp"
version = "0.1.0"
description = "Desktop app that runs rlx agents in the background"
license = "MIT"
repository = "https://github.com/AISquare-Studio/rlxapp"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
# Separate lib name so it doesn't collide with the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "rlxapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Release profile: LTO, one codegen unit, abort on panic and strip (https://v2.tauri.app/concept/size/).
# opt-level stays 3 (speed) rather than "s"; the bundle is ~4 MB either way, well inside budget.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
